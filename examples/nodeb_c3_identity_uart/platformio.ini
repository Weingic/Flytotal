; NodeB ESP32-C3 identity-chain UART sender.
; Open this folder as a separate PlatformIO project when flashing NodeB.

[platformio]
default_envs = esp32_c3_supermini

[env:esp32_c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200
monitor_filters = time, send_on_enter

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D NODEB_NODE_ID=\"B1\"
    -D NODEA_UART_TX_PIN=4
    -D NODEA_UART_RX_PIN=5
    -D NODEA_UART_BAUD=115200
    -D NODEB_RID_ID=\"SIM-RID-001\"
    -D NODEB_RID_AUTH_STATUS=\"VALID\"
    -D NODEB_RID_WHITELIST_TAG=\"WL_OK\"
